description: Workday does not publish list pricing for its platform or APIs. Access to the Workday
  Reporting, Prism Analytics, WQL, RaaS, Custom Reports, and Advanced Reports APIs is bundled with a
  Workday tenant subscription, which is sold via direct enterprise sales. There are no public free,
  pro, or self-serve API plans. All commercial terms are negotiated per customer.
sources:
  - https://www.workday.com/en-us/why-workday/about-us/contact-us.html
  - https://community.workday.com/api
notes: Workday public pricing pages return 404; the Workday Community API reference is gated behind
  customer authentication. No tier or per-call pricing is publicly disclosed. Trimmed to a single
  Contact Sales plan pending direct vendor confirmation.
plans:
  - id: workday-reporting-contact-sales
    name: Contact Sales
    type: enterprise
    description: Enterprise-only commercial terms negotiated as part of a Workday tenant subscription.
      API access (Reporting, Prism, WQL, RaaS, Custom Reports, Advanced Reports) is included with the
      underlying Workday product subscription; no separate API price list is published.
    entries:
      - label: Workday tenant subscription
        name: tenant_subscription
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Workday Report as a Service (RaaS)
      - name: Workday Custom Reports API
      - name: Workday Advanced Reports API
      - name: Workday Prism Analytics REST API
      - name: Workday Prism Analytics SOAP Web Service
      - name: Workday WQL API
