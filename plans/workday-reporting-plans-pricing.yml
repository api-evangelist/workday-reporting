description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: workday-reporting-free
    name: Free
    type: freemium
    description: Free entry tier for the Workday Reporting API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}/Reporting
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}
          - https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v2/{tenant}
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}/Prism_Analytics
          - https://wd2-impl-services1.workday.com/ccx/api/wql/v1/{tenant}
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}/Reporting
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}
          - https://wd2-impl-services1.workday.com/ccx/api/prismAnalytics/v2/{tenant}
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}/Prism_Analytics
          - https://wd2-impl-services1.workday.com/ccx/api/wql/v1/{tenant}
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: Community Support
      - name: Sandbox Access
      - name: Workday Report as a Service (RaaS)
      - name: Workday Custom Reports API
      - name: Workday Advanced Reports API
      - name: Workday Prism Analytics REST API
      - name: Workday Prism Analytics SOAP Web Service
      - name: Workday WQL API
  - id: workday-reporting-pro
    name: Professional
    type: paid
    description: Production tier for Workday Reporting. Provides higher quotas, priority support, and
      access to the broader API portfolio. Pricing placeholder; align with the provider's pricing page.
    entries:
      - label: API Requests
        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://wd2-impl-services1.workday.com/ccx/service/{tenant}/Reporting
