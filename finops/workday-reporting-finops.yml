description: FinOps shape for Workday Reporting is opaque. API consumption is included in a
  negotiated Workday tenant subscription with no published per-request meter or invoice line-item
  spec. Spend is tracked at the tenant/contract level rather than via FOCUS-style usage records.
sources:
  - https://www.workday.com/en-us/why-workday/about-us/contact-us.html
  - https://community.workday.com/api
notes: Workday does not publish a usage-billing API or FOCUS-aligned cost export. Meters and
  charge categories cannot be reconciled without authenticated access to the customer's Workday
  Community documentation and contract.
