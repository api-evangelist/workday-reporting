principles:
  - name: Visibility
    description: No public usage API. Customers rely on Workday's contract-level reporting and
      internal Workday Reporting tools to surface integration consumption.
  - name: Allocation
    description: Workday spend allocates by tenant and product subscription line; per-API or per-
      consumer-team allocation requires custom integration metadata captured outside Workday.
  - name: Optimization
    description: Levers are integration design choices (RaaS over SOAP, WQL batching, Prism dataset
      consolidation) rather than rate or commitment discounts.
  - name: Accountability
    description: Workday subscription is owned by HR/Finance procurement; integration teams own API
      design choices that influence tenant load.
