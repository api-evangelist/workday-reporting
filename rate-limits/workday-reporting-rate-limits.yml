specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Workday Reporting
providerId: workday-reporting
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Analytics
  - Reporting
  - HR Data
description: Workday does not publish a unified rate-limit policy for the Reporting, Prism Analytics,
  WQL, RaaS, Custom Reports, or Advanced Reports APIs in any public-facing documentation. The Workday
  Community reference (community.workday.com) is the canonical source and requires authenticated
  customer access. Limits are tenant-scoped and described per integration in the gated docs.
sources:
  - https://community.workday.com/api
responseCodes:
  serviceUnavailable: 503
limits:
  - name: Tenant-scoped throttling (see gated Workday Community documentation)
    scope: tenant
    metric: varies
    limit: see https://community.workday.com/api
    notes: Workday enforces tenant-level throttling and concurrency limits; specific values are
      published only inside the authenticated Workday Community reference. Long-running report
      executions and Prism dataset operations have their own concurrency caps documented per API.
policies:
  - name: Documentation gating
    description: Workday API rate-limit policy is published only on community.workday.com, which
      requires a customer login. No public per-second or per-minute numbers are available.
  - name: Backoff
    description: Standard guidance is exponential backoff with jitter on HTTP 503 and on documented
      Workday throttling SOAP faults.
  - name: Long-running operations
    description: Report and Prism operations are asynchronous; concurrency is bounded by the tenant's
      integration capacity rather than per-second request rates.
maintainers:
